name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Compile check
        run: python -m py_compile core.py config.py utils.py axel.py dashboad.py dashdashboard_app.py

      - name: Run tests with coverage
        run: pytest --cov=core --cov=config --cov=utils --cov-report=term-missing
