<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXEL - Login</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 80px 20px; }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 32px;
        }
        h1 { margin-top: 0; font-size: 24px; }
        label { display: block; margin: 16px 0 8px; font-weight: 600; }
        input[type=password] {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            font-size: 16px; background: #0b1622; color: #fff;
        }
        button {
            width: 100%; margin-top: 20px; padding: 12px; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700;
            background: #ff9800; color: #0b1622; cursor: pointer;
        }
        .error { color: #ff8a80; margin-top: 12px; }
        a { color: #ffb74d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AXEL Student Dashboard</h1>
            <p>Enter the shared password to continue.</p>
            <form method="POST" action="/login">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus>
                <button type="submit">Login</button>
            </form>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
        </div>
    </div>
</body>
</html>
